# Netlify ayarı: derleme yok, "site" klasörü olduğu gibi yayınlanır.
[build]
  publish = "site"
  command = ""

# Güvenlik başlıkları: site başka sitelerin içine gömülemez, sadece kendi dosyaları ve
# Supabase (Gidiyorum sayacı + Etkinliğini ekle formu) ile konuşabilir.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://xsskbnvpsjsuvjovehxc.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Etkinlik verisi her gün değişir; tarayıcı eski listeyi göstermesin.
[[headers]]
  for = "/veri/*.json"
  [headers.values]
    Cache-Control = "no-cache"

# Çevrimdışı dosyası hep taze gelsin (yeni sürüm hemen devreye girsin).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Uygulama tanıtım dosyası doğru türle gitsin (tarayıcı "yüklenebilir uygulama" olarak tanısın).
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Android uygulamasının bu siteye ait olduğunu Google'a kanıtlayan dosya.
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
