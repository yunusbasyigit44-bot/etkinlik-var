# Her sabah 06:00'da (Türkiye saati) etkinlikleri toplar ve depoya kaydeder.
# Siteyi Netlify yayınlar: depoya yeni kayıt gelince kendiliğinden yeniden yayınlar (netlify.toml).
name: Etkinlikleri guncelle

on:
  schedule:
    - cron: "0 3 * * *"       # 03:00 UTC = 06:00 Türkiye
  workflow_dispatch:           # GitHub'dan elle de çalıştırılabilir

permissions:
  contents: write

concurrency:
  group: guncelle
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Etkinlikleri topla
        env:
          ETKINLIK_IO_TOKEN: ${{ secrets.ETKINLIK_IO_TOKEN }}
        run: python -I toplayici/topla.py
      - name: Değişikliği kaydet
        run: |
          git config user.name "etkinlik-var-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/veri
          git diff --cached --quiet || git commit -m "Etkinlikler guncellendi $(date -u +%F)"
          git push
