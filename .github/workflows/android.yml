# Android uygulamasını GitHub'ın bilgisayarında derler (bizim bilgisayarda Android araçları yok).
# Sonuç: Play Store'a yüklenecek .aab ve telefona doğrudan kurulabilen .apk
# → GitHub'da Actions > "Android uygulamasi" > son çalıştırma > Artifacts > "etkinlik-var-android".
name: Android uygulamasi

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: İmza anahtarını hazırla
        env:
          IMZA_JKS_BASE64: ${{ secrets.IMZA_JKS_BASE64 }}
        run: |
          if [ -z "$IMZA_JKS_BASE64" ]; then echo "::warning::IMZA_JKS_BASE64 yok: uygulama IMZASIZ derlenecek (Play'e yüklenemez)"; exit 0; fi
          echo "$IMZA_JKS_BASE64" | base64 -d > "$RUNNER_TEMP/imza.jks"
      - name: Derle (.aab ve .apk)
        env:
          IMZA_DOSYASI: ${{ runner.temp }}/imza.jks
          IMZA_SIFRE: ${{ secrets.IMZA_SIFRE }}
          SURUM_KODU: ${{ github.run_number }}
        run: gradle -p android --no-daemon bundleRelease assembleRelease
      - name: İmza anahtarını sil
        if: always()
        run: rm -f "$RUNNER_TEMP/imza.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: etkinlik-var-android
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
